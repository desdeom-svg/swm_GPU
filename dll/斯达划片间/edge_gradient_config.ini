[Settings]
# 0 keeps the original GPU detection path. Set to 1 to enable Sobel-gradient adaptive threshold suppression.
EnableGradientThreshold=1
GradientScale=0.7
GradientDilateRadius=3

# 0 keeps the original candidate mask. When enabled, an elongated candidate is
# rotated to its principal axis, its per-column width median is calculated, and
# only pixels outside that median-width line by LineBulgeMinExcessWidth remain.
# Compact/non-elongated candidates are not changed.
EnableLineBulgeFilter=0
LineBulgeMinAspectRatio=6.0
LineBulgeMinExcessWidth=2

# 0 keeps all post-pad/probe candidates. Set to 1 to load svm_model.xml from the inspection.dll directory.
EnableSvmFilter=0
SvmThreshold=0.0

# Optional diagnostic crops saved under the inspection.dll directory.
EnableSaveSvmCropImages=0
SvmCropImageFormat=single_image

VerticalEdgeConnectDistance=10
